<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bot Pneus — Charles | GP Premium</title>
<style>
  :root{
    --bg:#0f1420; --card:#171d2b; --card2:#1e2636; --line:#2a3346;
    --txt:#e7ecf4; --mut:#93a0b5; --accent:#3b82f6; --accent2:#22c55e;
    --warn:#f59e0b; --danger:#ef4444; --cli:#243044; --bot:#1c3a2e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .sub{color:var(--mut);font-size:12px}
  header .spacer{flex:1}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent)}
  .wrap{padding:18px 20px;max-width:1200px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .n{font-size:26px;font-weight:800;line-height:1}
  .kpi .l{color:var(--mut);font-size:12px;margin-top:6px;text-transform:uppercase;letter-spacing:.4px}
  .kpi.green .n{color:var(--accent2)} .kpi.amber .n{color:var(--warn)} .kpi.blue .n{color:var(--accent)}
  .grid{display:grid;grid-template-columns:380px 1fr;gap:14px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .panel h2{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .leads{max-height:70vh;overflow-y:auto}
  .lead{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .lead:hover{background:var(--card2)}
  .lead.active{background:var(--card2);border-left:3px solid var(--accent);padding-left:11px}
  .lead .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .lead .nome{font-weight:600}
  .lead .tel{color:var(--mut);font-size:12px}
  .lead .prev{color:var(--mut);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .tag{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--cli);color:var(--txt)}
  .tag.medida{background:#243b55} .tag.modelo{background:#2c2450;color:#c9b8ff}
  .tag.loja{background:#1c3a2e;color:#7ee2a8} .tag.pausado{background:#3a1c1c;color:#ffb3b3}
  .conv{display:flex;flex-direction:column;min-height:70vh;max-height:78vh}
  .conv .head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .conv .head .nome{font-weight:700;font-size:15px}
  .conv .resumo{color:var(--mut);font-size:12px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--card2);font-style:italic}
  .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
  .msg{max-width:74%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap}
  .msg.in{align-self:flex-start;background:var(--cli);border-bottom-left-radius:3px}
  .msg.out{align-self:flex-end;background:var(--bot);border-bottom-right-radius:3px}
  .msg .meta{display:block;color:var(--mut);font-size:10.5px;margin-top:4px}
  .empty{color:var(--mut);text-align:center;padding:60px 20px}
  .banner{padding:12px 16px;border-radius:10px;margin-bottom:14px;font-size:13px}
  .banner.err{background:#3a1c1c;border:1px solid #5c2a2a;color:#ffc9c9}
  .banner.hidden{display:none}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.leads{max-height:40vh}}
</style>
</head>
<body>
<header>
  <div>
    <h1>🤖 Bot Pneus — Charles</h1>
    <div class="sub">Conversas do robô de vendas (GP Premium)</div>
  </div>
  <div class="spacer"></div>
  <button class="btn primary" onclick="carregar()">↻ Atualizar</button>
  <a class="btn" href="/admin.html">← Voltar ao CRM</a>
</header>

<div class="wrap">
  <div id="banner" class="banner err hidden"></div>

  <div class="kpis" id="kpis">
    <div class="kpi blue"><div class="n" id="k-total">–</div><div class="l">Leads totais</div></div>
    <div class="kpi"><div class="n" id="k-hoje">–</div><div class="l">Ativos hoje</div></div>
    <div class="kpi green"><div class="n" id="k-loja">–</div><div class="l">Vão à loja</div></div>
    <div class="kpi amber"><div class="n" id="k-pausado">–</div><div class="l">Bot pausado</div></div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Leads (mais recentes)</h2>
      <div class="leads" id="leads"><div class="empty">Carregando…</div></div>
    </div>
    <div class="panel conv">
      <div class="head" id="conv-head"><span class="nome">Selecione um lead</span></div>
      <div class="resumo" id="conv-resumo" style="display:none"></div>
      <div class="msgs" id="msgs"><div class="empty">Clique num lead à esquerda para ver a conversa.</div></div>
    </div>
  </div>
</div>

<script>
// ── autenticação: mesmo esquema do CRM (Authorization: Bearer <jwt>).
// Hoje o painel roda em "modo transição" (authWhatsapp não exige token),
// então funciona sem login. Se um dia o token estiver salvo, mandamos junto.
function authHeaders(){
  const t = localStorage.getItem('token') || localStorage.getItem('jwt')
          || localStorage.getItem('crm_token') || localStorage.getItem('authToken') || '';
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}
async function api(path){
  const r = await fetch(path, { credentials:'same-origin', headers: authHeaders() });
  const body = await r.json().catch(()=>({error:'resposta inválida do servidor'}));
  if(!r.ok){ const e = new Error(body.error || ('HTTP '+r.status)); e.status=r.status; e.dica=body.dica; throw e; }
  return body;
}
function fmtData(d){
  if(!d) return '';
  try{ const dt=new Date(d); return dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return ''; }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ehSaida(dir){ return /sa|out|env|bot|loja/i.test(String(dir||'')); }

function banner(msg){
  const b=document.getElementById('banner');
  if(!msg){ b.classList.add('hidden'); return; }
  b.textContent=msg; b.classList.remove('hidden');
}

let leadsCache=[], ativoId=null;

async function carregar(){
  banner('');
  document.getElementById('leads').innerHTML='<div class="empty">Carregando…</div>';
  try{
    const d = await api('/api/bot-pneus/resumo');
    const k = d.kpis||{};
    document.getElementById('k-total').textContent   = k.total ?? 0;
    document.getElementById('k-hoje').textContent    = k.hoje ?? 0;
    document.getElementById('k-loja').textContent    = k.viraramLoja ?? 0;
    document.getElementById('k-pausado').textContent = k.botPausados ?? 0;
    leadsCache = d.contatos||[];
    renderLeads();
  }catch(e){
    let m = 'Erro ao carregar: '+e.message;
    if(e.status===401) m='Sessão não autenticada. Faça login no CRM e recarregue esta página.';
    if(e.status===500 && e.dica) m=e.message+' — '+e.dica;
    if(e.status===502) m='Não consegui falar com o robô (pneus-bot). Ele pode estar fora do ar ou o token está errado.';
    banner(m);
    document.getElementById('leads').innerHTML='<div class="empty">—</div>';
  }
}

function renderLeads(){
  const el=document.getElementById('leads');
  if(!leadsCache.length){ el.innerHTML='<div class="empty">Nenhum lead ainda.</div>'; return; }
  el.innerHTML = leadsCache.map(c=>{
    const um=c.ultimaMensagem;
    const prev = um ? (ehSaida(um.direcao)?'🤖 ':'👤 ')+esc(um.texto||'') : '';
    const tags=[];
    if(c.medida) tags.push('<span class="tag medida">'+esc(c.medida)+'</span>');
    if(c.modeloRecomendado) tags.push('<span class="tag modelo">'+esc(c.modeloRecomendado)+'</span>');
    if(c.viraALoja) tags.push('<span class="tag loja">vai à loja</span>');
    if(c.botPausado) tags.push('<span class="tag pausado">bot pausado</span>');
    return '<div class="lead'+(c.id===ativoId?' active':'')+'" onclick="abrir(\''+esc(c.id)+'\')">'
      +'<div class="top"><span class="nome">'+esc(c.nome||'Sem nome')+'</span>'
      +'<span class="tel">'+fmtData(c.ultimaMsgEm)+'</span></div>'
      +'<div class="tel">'+esc(c.telefone||'')+'</div>'
      +(prev?'<div class="prev">'+prev+'</div>':'')
      +(tags.length?'<div class="tags">'+tags.join('')+'</div>':'')
      +'</div>';
  }).join('');
}

async function abrir(id){
  ativoId=id; renderLeads();
  const c=leadsCache.find(x=>x.id===id)||{};
  document.getElementById('conv-head').innerHTML='<span class="nome">'+esc(c.nome||'Lead')+'</span>'
    +'<span class="tel">'+esc(c.telefone||'')+'</span>';
  const rz=document.getElementById('conv-resumo');
  if(c.resumo){ rz.style.display='block'; rz.textContent='📋 '+c.resumo; } else rz.style.display='none';
  const msgsEl=document.getElementById('msgs');
  msgsEl.innerHTML='<div class="empty">Carregando conversa…</div>';
  try{
    const d = await api('/api/bot-pneus/conversa/'+encodeURIComponent(id));
    const ms=d.mensagens||[];
    if(!ms.length){ msgsEl.innerHTML='<div class="empty">Sem mensagens.</div>'; return; }
    msgsEl.innerHTML = ms.map(m=>{
      const out=ehSaida(m.direcao);
      const autor = m.autor?esc(m.autor)+' · ':'';
      return '<div class="msg '+(out?'out':'in')+'">'+esc(m.conteudo||'')
        +'<span class="meta">'+autor+fmtData(m.criadoEm)+'</span></div>';
    }).join('');
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }catch(e){
    msgsEl.innerHTML='<div class="empty">Erro ao carregar conversa: '+esc(e.message)+'</div>';
  }
}

carregar();
</script>
</body>
</html>
